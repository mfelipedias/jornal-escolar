{% extends "layouts/auth.html" %}
{% block title %}Sair · {{ jornal.name }}{% endblock title %}
{% block auth_content %}
  <h1 class="text-center font-display text-h2 font-extrabold tracking-tight">Sair</h1>
  <p class="mt-2 text-center text-ui text-ink-2">Deseja encerrar a sessão neste aparelho?</p>
  <form method="post" action="{% url 'accounts:logout' %}" class="mt-8">
    {% csrf_token %}
    <button type="submit"
            class="btn-primary w-full py-3">
      Sair
    </button>
  </form>
  <p class="mt-6 text-center text-ui">
    <a href="{% url 'core:home' %}" class="link-arrow"><span aria-hidden="true">←</span> Voltar para o jornal</a>
  </p>
{% endblock auth_content %}
