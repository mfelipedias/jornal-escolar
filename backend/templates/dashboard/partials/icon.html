{% comment %}
  Ícones em traço do painel (24x24, currentColor). Parâmetro: name
  (home, list, plus, user, key, settings, newspaper, menu, pencil, bell, star, file).
{% endcomment %}
<svg class="size-5 shrink-0"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true">
  {% if name == "home" %}
    <path d="M3 10.5 12 3l9 7.5" />
    <path d="M5 9.5V21h14V9.5" />
    <path d="M10 21v-6h4v6" />
  {% elif name == "list" %}
    <path d="M8 6h13M8 12h13M8 18h13" />
    <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14" />
  {% elif name == "user" %}
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21a8 8 0 0 1 16 0" />
  {% elif name == "key" %}
    <circle cx="8" cy="15" r="4" />
    <path d="m10.8 12.2 9.2-9.2M16 7l3 3M14 9l2 2" />
  {% elif name == "settings" %}
    <circle cx="12" cy="12" r="3" />
    <path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" />
  {% elif name == "newspaper" %}
    <path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z" />
    <path d="M17 9h3v10a2 2 0 0 1-2 2" />
    <path d="M8 9h5M8 13h5M8 17h3" />
  {% elif name == "menu" %}
    <path d="M4 6h16M4 12h16M4 18h16" />
  {% elif name == "pencil" %}
    <path d="M4 20h4L19 9l-4-4L4 16z" />
    <path d="m13.5 6.5 4 4" />
  {% elif name == "star" %}
    <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z" />
  {% elif name == "file" %}
    <path d="M6 3h8l4 4v14H6z" />
    <path d="M14 3v4h4M9 12h6M9 16h6" />
  {% endif %}
</svg>
