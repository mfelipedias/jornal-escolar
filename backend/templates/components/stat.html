{% comment %}
  Número grande com rótulo, para o painel (docs/09, "stat").
  Parâmetros: value, label; url opcional (o bloco vira link).
{% endcomment %}
{% if url %}
  <a href="{{ url }}"
     class="block rounded-card border border-line bg-white px-4 py-3 hover:border-accent">
    <span class="block font-display text-h1 font-semibold text-ink">{{ value }}</span>
    <span class="block text-meta text-ink-2">{{ label }}</span>
  </a>
{% else %}
  <div class="rounded-card border border-line bg-white px-4 py-3">
    <span class="block font-display text-h1 font-semibold text-ink">{{ value }}</span>
    <span class="block text-meta text-ink-2">{{ label }}</span>
  </div>
{% endif %}
