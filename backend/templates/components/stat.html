{% comment %}
  Número grande com rótulo, para o painel (docs/09, "stat").
  Parâmetros: value, label; url opcional (o bloco vira link).
{% endcomment %}
{% if url %}
  <a href="{{ url }}"
     class="block rounded-card border border-line bg-white px-5 py-4 transition duration-200 ease-snappy hover:-translate-y-0.5 hover:border-accent hover:shadow-card-hover">
    <span class="block font-display text-h1 font-extrabold text-ink">{{ value }}</span>
    <span class="block text-meta text-ink-2">{{ label }}</span>
  </a>
{% else %}
  <div class="rounded-card border border-line bg-white px-5 py-4">
    <span class="block font-display text-h1 font-extrabold text-ink">{{ value }}</span>
    <span class="block text-meta text-ink-2">{{ label }}</span>
  </div>
{% endif %}
