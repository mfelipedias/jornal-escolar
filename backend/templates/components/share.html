{% comment %}
  Compartilhar (docs/11): copiar link, WhatsApp e compartilhamento nativo do celular. Sem SDKs.
  Parâmetros: url (absoluta), title. Comportamento em frontend/src/js/app.js ("share").
  Sem JavaScript, o link do WhatsApp continua funcionando.
{% endcomment %}
<div class="flex flex-wrap items-center gap-2"
     x-data="share"
     data-url="{{ url }}"
     data-title="{{ title }}">
  <span class="mr-1 text-meta font-semibold text-ink-2">Compartilhar:</span>
  <button type="button"
          class="btn-secondary min-h-11"
          x-show="true"
          x-cloak
          @click="copy()">
    <span x-text="copied ? 'Link copiado!' : 'Copiar link'">Copiar link</span>
  </button>
  <a class="btn-secondary min-h-11"
     href="https://wa.me/?text={{ title|urlencode:"" }}%20{{ url|urlencode:"" }}"
     target="_blank"
     rel="noopener noreferrer">WhatsApp</a>
  <button type="button"
          class="btn-secondary min-h-11"
          x-show="canShare"
          x-cloak
          @click="native()">Mais opções</button>
  <input type="text"
         x-ref="link"
         hidden
         readonly
         value="{{ url }}"
         aria-label="Link da publicação"
         class="field w-full sm:w-80">
  <span class="sr-only"
        role="status"
        aria-live="polite"
        x-text="copied ? 'Link copiado' : ''"></span>
</div>
