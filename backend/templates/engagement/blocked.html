{% extends "layouts/public.html" %}
{% block title %}Reação não registrada · {{ jornal.name }}{% endblock title %}
{% block content %}
  <div class="site-container py-16">
    <div class="panel mx-auto max-w-reading p-6 text-center sm:p-10">
      <div class="flex justify-center">{% include "components/sticker.html" %}</div>
      <h1 class="mt-5 font-display text-h2 font-extrabold text-balance">Reação não registrada</h1>
      <p class="mt-3 text-ui text-ink-2">{{ notice }}</p>
      <p class="mt-6">
        <a href="{{ article.get_absolute_url }}#reacoes"
           class="btn-secondary min-h-11">Voltar para a publicação</a>
      </p>
    </div>
  </div>
{% endblock content %}
