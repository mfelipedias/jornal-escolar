[project]
name = "jornal-escolar"
# A versão oficial do sistema fica no arquivo VERSION da raiz (docs/30).
version = "0.0.1"
description = "Jornal digital escolar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django[argon2]>=5.2,<6.0",
    "django-allauth[socialaccount]>=65.19",
    "django-environ>=0.12",
    "django-vite>=3.1",
    "nh3>=0.3",
    "pillow>=11.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "procrastinate[django]>=3.5",
]

[dependency-groups]
dev = [
    "djlint>=1.36",
    "factory-boy>=3.3",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.13",
]

[tool.uv]
# Projeto de aplicação, não é um pacote para publicar no PyPI.
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["static/dist", "**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes
    "I",    # ordem dos imports
    "B",    # bugbear: armadilhas comuns
    "UP",   # sintaxe moderna do Python
    "DJ",   # boas práticas do Django
    "SIM",  # simplificações
    "C4",   # comprehensions
    "PT",   # estilo do pytest
    "RUF",  # regras do próprio ruff
]
ignore = [
    "RUF012",  # atributos mutáveis de classe são o padrão do Django (Meta, admin)
]

[tool.ruff.lint.per-file-ignores]
# Dados de seed ficam mais legíveis em uma linha por item.
"**/seed_data.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db --strict-markers"

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
format_attribute_template_tags = true
# H006: largura/altura em <img> é tratada pelo srcset e CSS (docs/09).
# H030/H031: meta description e keywords ficam no layout base (E26).
ignore = "H006,H030,H031"
